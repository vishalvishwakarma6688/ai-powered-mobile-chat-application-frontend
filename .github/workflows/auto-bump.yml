name: Auto Bump & Tag Version

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: auto-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip if the commit was made by our release bot to prevent infinite loop
    if: "github.event.head_commit.author.name != 'github-actions[bot]' && github.event.head_commit.committer.name != 'github-actions[bot]'"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_BUMP_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master

      - name: Bump Version
        run: |
          BUMP_TYPE="${{ inputs.bump_type || 'patch' }}"
          echo "Bumping version ($BUMP_TYPE)..."
          npm version $BUMP_TYPE --no-git-tag-version

          # Sync version in app.json as well
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = pkg.version;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n', 'utf8');
            console.log('Synced version ' + pkg.version + ' to app.json');
          "

      - name: Commit & Push Version Change
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          
          # Stage version files including package-lock.json
          git add package.json package-lock.json app.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to v$NEW_VERSION"
            git push origin master
          else
            echo "No version changes to commit."
          fi

      - name: Create & Push Tag
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$NEW_VERSION"
          
          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists, skipping."
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi
